# Fly.io deployment (ADR-015, ADR-020). The app name must be globally unique on Fly;
# it is also the subdomain: https://mfk-family-board.fly.dev
app = "mfk-family-board"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a temporary machine before the new version takes traffic.
  # If a migration fails, the deploy stops and the old version keeps running (ADR-021).
  release_command = "dotnet FamilyApp.Host.dll migrate"

[env]
  # Fly terminates TLS and forwards plain http. Trust its X-Forwarded-Proto header so the app
  # knows requests were really https: needed for Secure cookies and Google's redirect URL.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when idle and start it on the next request: pennies instead of an always-on VM,
  # at the cost of a cold start of a second or two after quiet spells (ADR-019).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Liveness only: never wakes the database (ADR-019).
    method = "GET"
    path = "/api/health/live"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
