# Production on the Hetzner server (ADR-034). The deploy job copies this file and the Caddyfile
# to /opt/family-app and writes .env next to them; nothing here is edited on the server by hand.

services:
  app:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Caddy terminates TLS and forwards plain http. Trust its X-Forwarded-Proto so the app
      # knows requests were https (Secure cookies, Google's redirect URL). Safe because the app
      # port is reachable only from Caddy, on this private Docker network.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    expose:
      - "8080"

  # The MCP server for agents (ADR-041): the same image as the app, so one tag deploys matching
  # versions of both. Deliberately no env_file: it holds no secrets. Each caller's access token is
  # forwarded to the app, which checks it.
  mcp:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    command: ["dotnet", "mcp/FamilyApp.Mcp.dll", "--http"]
    depends_on:
      - app
    environment:
      ASPNETCORE_URLS: http://+:8080
      FAMILY_API_URL: http://app:8080
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - mcp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; losing them means re-issuing, and Let's Encrypt rate-limits that.
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump of Neon to ./backups on this server, 14 days kept (ADR-036). pg_dump 18 can
  # dump older servers; its version must be at least the server's.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      # Only this one setting, not the whole .env: the backup needs nothing else.
      DATABASE_URL: ${BACKUP_DATABASE_URL}
      KEEP_DAYS: "14"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups

volumes:
  caddy_data:
  caddy_config:
