name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FamilyApp.slnx

      - name: Build
        run: dotnet build FamilyApp.slnx --no-restore -c Release

      # Integration tests start a real Postgres via Testcontainers; the runner has Docker.
      - name: Test
        run: dotnet test FamilyApp.slnx --no-build -c Release --logger "console;verbosity=normal" --logger trx --results-directory TestResults

      # Surface the totals as an annotation, visible on the run page without opening logs.
      - name: Report test totals
        if: always()
        run: |
          for f in TestResults/*.trx; do
            [ -f "$f" ] || continue
            counters=$(grep -o '<Counters [^>]*>' "$f" | grep -oE '(total|executed|passed|failed)="[0-9]+"' | tr '\n' ' ')
            echo "::notice title=$(basename "$f")::$counters"
          done
          # One annotation per failed test, with the start of its message.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/*.trx"):
              for result in ET.parse(path).getroot().iterfind(".//t:UnitTestResult", ns):
                  if result.get("outcome") != "Failed":
                      continue
                  message = result.find(".//t:ErrorInfo/t:Message", ns)
                  text = (message.text or "").strip() if message is not None else ""
                  text = text[:900].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={result.get('testName')}::{text}")
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type-check and build
        run: npm run build

  # Builds the production image. On main it is pushed to GitHub's container registry, tagged with
  # the commit, so every deploy names exactly which build is running (ADR-034).
  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/michaelfkeenan/family-app
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  # Continuous deployment (ADR-020, ADR-034): every green push to main goes live on the server.
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/michaelfkeenan/family-app
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DOMAIN: ${{ secrets.DOMAIN }}
      NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Check deploy settings
        id: ready
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DOMAIN NEON_CONNECTION_STRING; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping deploy: missing repository secrets:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.ready.outputs.ok == 'true'

      # Trust-on-first-use: the server's host key is fetched each run rather than pinned, so a
      # network attacker between GitHub and Hetzner could impersonate the server (ADR-034).
      - name: Set up SSH
        if: steps.ready.outputs.ok == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' "$DEPLOY_HOST" > ~/.ssh/config

      # Secrets travel from GitHub to a 600-mode .env file on the server; they never enter the image.
      - name: Write production settings
        if: steps.ready.outputs.ok == 'true'
        run: |
          umask 077
          {
            echo "IMAGE=$IMAGE"
            echo "IMAGE_TAG=${{ github.sha }}"
            echo "DOMAIN=$DOMAIN"
            echo "ConnectionStrings__Postgres='$NEON_CONNECTION_STRING'"
            echo "BACKUP_DATABASE_URL='$(python3 .github/backup_url.py)'"
            if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
              echo "Authentication__Google__ClientId='$GOOGLE_CLIENT_ID'"
              echo "Authentication__Google__ClientSecret='$GOOGLE_CLIENT_SECRET'"
            fi
          } > production.env
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::notice::Google sign-in not configured: add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET secrets."
          fi

      - name: Copy configuration to the server
        if: steps.ready.outputs.ok == 'true'
        run: |
          scp -q infra/compose.yml infra/Caddyfile infra/backup.sh server:/opt/family-app/
          scp -q production.env server:/opt/family-app/.env
          ssh server 'chmod 600 /opt/family-app/.env'

      # Same order as Fly's release command: migrate first, and only start the new version if that
      # worked. If migration fails, set -e stops here and the old containers keep running (ADR-021).
      - name: Migrate and restart
        if: steps.ready.outputs.ok == 'true'
        run: |
          ssh server "set -e
            cd /opt/family-app
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull --quiet app
            docker compose run --rm --no-deps app dotnet FamilyApp.Host.dll migrate
            docker compose up -d --remove-orphans
            # up -d leaves Caddy running when only its mounted Caddyfile changed, so make it re-read the
            # file. A reload is graceful: open connections and certificates are kept.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker logout ghcr.io
            docker image prune -f"

      - name: Smoke test
        if: steps.ready.outputs.ok == 'true'
        run: |
          # The first deploy waits for Caddy to get a certificate, so allow a couple of minutes.
          healthy=false
          for i in $(seq 1 18); do
            if curl -fsS "https://$DOMAIN/api/health"; then echo; healthy=true; break; fi
            sleep 10
          done
          if [ "$healthy" != true ]; then
            echo "::error::https://$DOMAIN/api/health did not report healthy"
            ssh server 'cd /opt/family-app && docker compose ps && docker compose logs --tail 40 app caddy' || true
            exit 1
          fi
          # The MCP server (ADR-041) is up if it turns away a request without a token. That 401 comes
          # from the MCP container itself, so it touches neither the app nor the database.
          for i in $(seq 1 6); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$DOMAIN/mcp")
            if [ "$status" = 401 ]; then echo "MCP server answered 401 without a token, as it should."; exit 0; fi
            sleep 5
          done
          echo "::error::https://$DOMAIN/mcp answered $status without a token; expected 401"
          ssh server 'cd /opt/family-app && docker compose ps && docker compose logs --tail 40 mcp caddy' || true
          exit 1

      # Shows the newest nightly backup on the run page, so a backup that stopped working is noticed (ADR-036).
      - name: Report latest backup
        if: steps.ready.outputs.ok == 'true'
        run: |
          latest=$(ssh server 'cd /opt/family-app/backups 2>/dev/null && ls -t family-*.dump 2>/dev/null | head -1')
          if [ -z "$latest" ]; then
            echo "::notice title=Backup::No backup yet; the first runs after 02:00 UTC."
          else
            size=$(ssh server "du -h /opt/family-app/backups/$latest | cut -f1")
            echo "::notice title=Backup::Latest: $latest ($size)"
            today=$(date -u +%F); yesterday=$(date -u -d yesterday +%F)
            case "$latest" in
              *"$today"*|*"$yesterday"*) ;;
              *) echo "::warning title=Backup::The newest backup is $latest; nightly backups may be failing. Check: docker compose logs backup" ;;
            esac
          fi
